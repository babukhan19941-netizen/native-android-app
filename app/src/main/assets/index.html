<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Brick Game 999</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #121212;
    color: #fff;
    font-family: sans-serif;
    overflow: hidden;
    touch-action: none;
  }
  #gameCanvas {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
  // Bridges JS vibration calls to native Android hardware vibrator.
  // Falls back to the standard Web Vibration API if the native bridge
  // isn't available (e.g. testing in a normal browser).
  function triggerVibrate(ms = 20) {
    if (window.AndroidNative && typeof window.AndroidNative.vibrate === "function") {
      window.AndroidNative.vibrate(ms);
    } else if (navigator.vibrate) {
      navigator.vibrate(ms);
    }
  }

  // ----- Replace below with your actual game logic -----
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  ctx.fillStyle = "#fff";
  ctx.font = "20px sans-serif";
  ctx.fillText("Brick Game 999 - tap to test vibration", 20, 40);

  canvas.addEventListener("touchstart", () => triggerVibrate(30));
  canvas.addEventListener("click", () => triggerVibrate(30));
</script>
</body>
</html>
